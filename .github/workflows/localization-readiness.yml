# Surfaces the result of the localization verifier (tools/translation-verifier.js) directly on the
# automatic localization pull request, so a not-ready import is obvious before anyone merges it.
#
# On the localization PR it posts a single sticky comment, toggles the "localization: not ready"
# label, and fails this check when the import reverted a reviewed translation or broke a placeholder.
# On every other PR the job is a no-op that succeeds, so this check can be marked required for `main`
# in branch protection without blocking unrelated contributions. (Marking it required is the one
# repository-settings step that turns the signal into a hard merge block.)
name: Localization Readiness

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: localization-readiness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  localization-readiness:
    name: localization-readiness
    runs-on: ubuntu-latest
    steps:
      - name: Determine whether this is the automatic localization PR
        id: gate
        # The comparison is evaluated by the GitHub expression engine and only its boolean result is
        # written to the output. The (fork-controlled) branch name is never interpolated into the
        # shell, so a malicious ref such as `evil$(...)` cannot inject a command here.
        run: echo "is_loc=${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'localization' }}" >> "$GITHUB_OUTPUT"

      - name: Check out the repository
        if: steps.gate.outputs.is_loc == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        if: steps.gate.outputs.is_loc == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: yarn

      - name: Install Yarn
        if: steps.gate.outputs.is_loc == 'true'
        run: npm install -g yarn

      - name: Install dependencies
        if: steps.gate.outputs.is_loc == 'true'
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Verify imported translations
        id: verify
        if: steps.gate.outputs.is_loc == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/translation-verifier.js 2>&1 | tee translation-verifier-output.txt

      - name: Update localization readiness signal
        if: always() && steps.gate.outputs.is_loc == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- localization-readiness -->';
            const blockingLabel = 'localization: not ready';
            const ready = process.env.VERIFY_OUTCOME === 'success';

            // The localization branch is force-pushed daily; if this run is already stale (the PR now
            // points at a newer commit) leave the signal to the newer run instead of overwriting it.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            if (pr.head.sha !== process.env.EXPECTED_HEAD_SHA) {
              core.notice(`Skipping stale readiness update for ${process.env.EXPECTED_HEAD_SHA}; PR now at ${pr.head.sha}.`);
              return;
            }

            let output = '';
            try {
              output = fs.readFileSync('translation-verifier-output.txt', 'utf8');
            } catch {
              output = '';
            }

            const decode = (v) => v.replace(/%0A/gi, '\n').replace(/%0D/gi, '\r').replace(/%25/gi, '%');
            const issues = output.split(/\r?\n/)
              .map((line) => /^::error file=([^,]+),title=([^:]+)::(.*)$/.exec(line))
              .filter(Boolean)
              .map((m) => ({ file: decode(m[1]), title: decode(m[2]), message: decode(m[3]).replace(/\s+/g, ' ').trim() }));

            // Toggle the blocking label.
            if (ready) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: blockingLabel });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            } else {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [blockingLabel] });
            }

            const runLink = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const shaShort = process.env.EXPECTED_HEAD_SHA.slice(0, 7);

            let lines;
            if (ready) {
              lines = [
                marker,
                '## ✅ Localization readiness: READY',
                '',
                'Reviewed translation fixes are intact and every checked placeholder and `${variable}` is preserved.',
                '',
                `Checked commit \`${shaShort}\`. This check covers localization integrity only; normal review and other checks still apply.`
              ];
            } else {
              const shown = issues.slice(0, 50);
              const detail = shown.length > 0
                ? shown.map((i) => `- **${i.title}** — \`${i.file}\`: ${i.message}`)
                : [`- The verifier did not complete. See the [workflow logs](${runLink}).`];
              const more = issues.length > shown.length ? [`- …and ${issues.length - shown.length} more; see the [workflow logs](${runLink}).`] : [];
              lines = [
                marker,
                '## ⛔ Localization readiness: NOT READY — do not merge',
                '',
                'This import reverted a reviewed translation fix or broke a required placeholder / `${variable}`.',
                '',
                '### Issues',
                ...detail,
                ...more,
                '',
                'To fix: run `node tools/translation-verifier.js --restore` for reverted fixes, correct any remaining placeholder/variable mismatches, and let the localization pipeline regenerate the branch.',
                '',
                `Checked commit \`${shaShort}\`. [Workflow logs](${runLink}).`
              ];
            }
            const body = lines.join('\n');

            // Keep a single sticky comment across the daily force-push, matched by the hidden marker.
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user && c.user.login === 'github-actions[bot]' && c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Enforce localization readiness
        if: always() && steps.gate.outputs.is_loc == 'true' && steps.verify.outcome != 'success'
        run: |
          echo "The automatic localization import is not ready to merge; see the pull request comment for details."
          exit 1
