# Copilot Cloud Agent – Environment Setup
#
# This workflow is invoked automatically by GitHub Copilot infrastructure to
# prepare the agent's sandbox before it works on tasks in this repository.
# It does NOT run on push/PR events.
#
# Dependency installs use the configured Azure Artifacts feed without a
# public-registry fallback. The environment must have access to that feed.

name: "Copilot Setup Steps"

on: workflow_dispatch

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: bash ./.github/scripts/yarn-install.sh --frozen-lockfile

      - name: Validate – run backend tests
        run: yarn backendTests
